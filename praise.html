<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="찬양집회 콘티로 한글·영어 가사 PPT를 만들어 드립니다." />
    <!-- Matches the paper the app's header is frosted from in each theme, so
         the browser UI continues the page instead of framing it. -->
    <meta name="theme-color" content="#f4efe5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)" />
    <!-- Pretendard carries every word you read or type; Noto Serif KR sets the
         headings and the numerals. Both degrade to the platform faces if the
         fonts never arrive, so the app stays usable offline. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>찬양집회 PPT Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/praise/main.tsx"></script>
  </body>
</html>
