name: Deploy AI Proxy Worker

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    # Deploy only on pushes (or manual runs) targeting whatever the default branch currently is —
    # never from a pull_request event, so a fork can't trigger a deploy using these secrets.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preserve phone remote-link namespace
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-deploy.mjs

      - name: Check bundled phone remote connection button
        working-directory: worker
        run: |
          npm ci --ignore-scripts
          node scripts/check-remote-launcher.mjs

      # Cloudflare rejects `secret bulk` when the latest Worker version has
      # never been deployed (API error 10215). Bootstrap the current script
      # first; the next step can then update its secrets safely.
      - name: Deploy Worker code
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.110.0'
          command: deploy --config .wrangler.deploy.toml --keep-vars

      # wrangler-action fails outright when a listed secret has no value
      # ("Value for secret X not found in environment"), so build the list
      # from the repo secrets that are actually set — an unset provider key
      # must skip that provider, not break the whole deploy.
      - name: List provider API keys that have repo secrets
        id: provider-keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
        run: |
          {
            echo 'list<<LIST'
            for name in GEMINI_API_KEY HUGGINGFACE_API_KEY OPENROUTER_API_KEY SERPAPI_API_KEY FEEDBACK_EMAIL; do
              if [ -n "${!name}" ]; then
                echo "$name"
              else
                echo "skipping $name — no repo secret set" >&2
              fi
            done
            echo 'LIST'
          } >> "$GITHUB_OUTPUT"

      - name: Sync secrets and redeploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Pin explicitly: without this the action falls back to installing
          # its own (older) default wrangler version instead of the one in
          # worker/package.json, and that stale version's `secret bulk`
          # command fails to upload secrets.
          wranglerVersion: '4.110.0'
          command: deploy --config .wrangler.deploy.toml --keep-vars
          # Pushes each listed env var into the Worker as a secret before
          # deploying. The list comes from the step above, so only keys with
          # a non-empty repo secret are attempted.
          secrets: ${{ steps.provider-keys.outputs.list }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}

      - name: Verify storage plan and phone redirect route
        run: |
          node --input-type=module <<'JS'
          const base = 'https://lyrics-ai-proxy.spencerkim1235.workers.dev';
          let failure;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const plan = await fetch(`${base}/freecast/storage-plan`, { headers: { Origin: 'https://shrlak.github.io' } });
              if (!plan.ok) throw new Error(`Storage plan returned ${plan.status}`);
              const data = await plan.json();
              if (data.limitBytes !== 5000000000 || data.plan !== 'workers-free') throw new Error('Unexpected storage quota');
              const phone = await fetch(`${base}/freecast/remote/deploy-smoke-${process.env.GITHUB_RUN_ID}`, { redirect: 'manual' });
              if (phone.status !== 404) throw new Error(`Phone route returned ${phone.status}; expected unregistered link`);
              const root = `${base}/freecast/remote/`;
              const home = await fetch(root, { redirect: 'manual' });
              if (home.status !== 200 || !(await home.text()).includes('apple-mobile-web-app-capable')) throw new Error('Permanent remote web app unavailable');
              const manifest = await (await fetch(`${root}manifest.webmanifest`)).json();
              if (manifest.id !== '/freecast/remote/' || manifest.display !== 'standalone') throw new Error('Unexpected web app identity');
              const offline = await fetch(`${root}sw.js`);
              if (!offline.ok || !(await offline.text()).includes('freecast-remote-shell-')) throw new Error('Offline shell unavailable');
              const lyrics = `${base}/libraries/lyrics`;
              const register = await fetch(lyrics, { method: 'PUT', headers: { Origin: 'https://shrlak.github.io', 'content-type': 'application/json' }, body: JSON.stringify({ entry: { title: '', sections: [] } }) });
              if (register.status !== 400) throw new Error(`Password-free registration validation returned ${register.status}`);
              const remove = await fetch(lyrics, { method: 'DELETE', headers: { Origin: 'https://shrlak.github.io', 'content-type': 'application/json' }, body: '{}' });
              if (remove.status !== 403) throw new Error(`Song deletion without administrator returned ${remove.status}`);
              console.log('Password-free song registration validation and protected deletion verified without writing library data');
              console.log('Storage quota, fixed remote web app and phone route verified');
              failure = null;
              break;
            } catch (e) { failure = e; await new Promise((r) => setTimeout(r, 5000)); }
          }
          if (failure) throw failure;
          JS

      - name: Check the deployed phone remote script
        run: node worker/scripts/check-remote-launcher.mjs --live
