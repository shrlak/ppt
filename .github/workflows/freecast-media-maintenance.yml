name: FreeCast media maintenance
on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: 'Exact reviewed inventory SHA-256; blank performs inventory only'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'shrlak/ppt' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read authenticated server inventory
        env:
          APPLY_FINGERPRINT: ${{ inputs.fingerprint }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node --test scripts/freecast-media-cleanup.test.mjs
          node scripts/freecast-media-maintenance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: freecast-media-inventory
          path: maintenance-output/
          retention-days: 3
