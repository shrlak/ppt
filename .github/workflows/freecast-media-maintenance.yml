name: FreeCast media maintenance
on:
  push:
    branches: [maintenance/freecast-media-inventory]
    paths:
      - 'scripts/freecast-media-maintenance.mjs'
      - 'scripts/freecast-media-cleanup.mjs'
      - '.github/workflows/freecast-media-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'shrlak/ppt' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'maintenance/freecast-media-inventory')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read authenticated server inventory
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/freecast-media-maintenance.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: freecast-media-inventory
          path: maintenance-output/
          retention-days: 3
