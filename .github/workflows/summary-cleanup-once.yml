name: Requested summary media deletion
on:
  push:
    branches: [feat/service-media-lifecycle]
    paths: ['scripts/delete-summary-media.mjs', '.github/workflows/summary-cleanup-once.yml']
permissions:
  contents: read
jobs:
  cleanup:
    if: github.repository == 'shrlak/ppt'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Delete only the explicitly requested summary media
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/delete-summary-media.mjs
