name = "lyrics-ai-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Comma-separated list of origins allowed to call this proxy. Must match the
# deployed site exactly (scheme + host, no trailing slash) — the GitHub Pages
# URL derived from vite.config.ts's base path ("/ppt/").
# Add a second origin (comma-separated) for local dev, e.g. "http://localhost:4173".
[vars]
ALLOWED_ORIGINS = "https://shrlak.github.io"
# Dashboard reference limits. Gemini quotas vary per project; update this to
# the RPD value shown in AI Studio.
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_DAILY_REQUEST_LIMIT = "250"
# OpenRouter's free-model allowance is shared across all :free models. Keep
# this at 50 for accounts that have not purchased credits; set it to 1000
# after the account has purchased at least $10 in credits.
OPENROUTER_MODEL = "nvidia/nemotron-nano-12b-v2-vl:free"
OPENROUTER_DAILY_REQUEST_LIMIT = "50"
# Weekly wipe of the shared PPT library: every saved deck and its files are
# deleted each Sunday at 5 PM in this timezone (the 곡 라이브러리 is kept).
# PURGE_WEEKDAY overrides the day and follows JavaScript's Date#getDay()
# (0 = Sunday) — NOT the cron weekday numbering below. Changing any of these
# means changing the cron expression to match.
# Bugs is a commercial service; scraping its pages is a permission decision,
# not a code decision. Left "false", the proxy may show a Bugs search result as
# a link the user can open, but never fetches the page itself. The deployment's
# administrator turned it on so Bugs pages join the web lyrics check.
BUGS_SCRAPING_ALLOWED = "true"
# Extra hosts the 수요예배 찬양 PPT search should treat as known 자료실, on top
# of the 네이버 블로그·카페, 갓피플 and 티스토리 hosts src/songPpt.js ships
# with. Hits on these outrank a page that merely shares a word with the title.
# An entry covers its subdomains too. Comma-separated hostnames, no scheme:
#   WEDNESDAY_PPT_HOSTS = "praise.example.kr,files.example.kr"
WEDNESDAY_PPT_HOSTS = ""
# 찬양 PPT are downloaded from any https host by default and judged on what
# comes back (ZIP magic bytes plus ppt/presentation.xml, 25MB cap, no address
# that resolves inside, redirects re-checked) — the way a song is really found
# is to search its title and open whichever site comes up first, which is a
# different one most weeks. Set this to "true" to restrict downloads to
# WEDNESDAY_PPT_HOSTS instead; off-list hits are then shown as links to open
# and download by hand.
WEDNESDAY_PPT_HOSTS_ONLY = "false"
# The same choice for 악보 사진, judged on PNG/JPEG magic bytes and an 8MB cap.
# "true" restricts them to WEDNESDAY_PPT_HOSTS as well.
WEDNESDAY_IMAGE_HOSTS_ONLY = "false"
PURGE_TIMEZONE = "America/New_York"
PURGE_HOUR = "17"

# Cron triggers are UTC-only, so the Worker wakes at both hours that can be
# 5 PM Eastern — 21:00 UTC under EDT and 22:00 UTC under EST — and src/purge.js
# runs the purge on whichever firing is actually 17:00 local. The other firing
# sees the week already purged and does nothing, so DST never shifts the wipe.
#
# Spelled SUN, not 0: Cloudflare's weekday field runs 1 = Sunday .. 7 =
# Saturday, so the usual `* * * * 0` is out of range and the deploy fails with
# "Some triggers failed to deploy ... /schedules". Both hours ride one
# expression rather than two, which keeps this to a single trigger against the
# free plan's cap of 5 per account.
[triggers]
crons = ["0 21,22 * * SUN"]

[[durable_objects.bindings]]
name = "USAGE_TRACKER"
class_name = "UsageTracker"

# This existing SQLite Durable Object stores shared AI usage/settings, the
# cross-device lyrics library, the chunked PPT library, and the learning store
# (model accuracy, verified corrections, and the training corpus). No R2/D1
# binding needed.
#
# The weekly purge below deletes the PPT library only. Learning keys
# (learning:*) are deliberately outside it: a corpus wiped every Sunday could
# never train anything. The corpus is capped at 300 page images instead, and
# only records already exported into an artifact are evicted.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageTracker"]

# API keys are NOT set here (this file is committed to git). Set them with:
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
# The 수요예배 찬양 PPT search asks Google (티스토리·갓피플) only when this
# optional key from https://serper.dev is set:
#   npx wrangler secret put SERPER_API_KEY
# POST /settings (shared recognition settings) is guarded by the 관리자 설정
# password. It defaults to the app's built-in admin password; override with:
#   npx wrangler secret put ADMIN_PASSWORD
