<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="찬양 가사와 성경 말씀 슬라이드를 자동으로 만들어 드립니다." />
    <!-- Matches the first stop of the app's chrome bar in each theme, so the
         browser UI continues the header instead of framing it. -->
    <meta name="theme-color" content="#1b1436" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0b14" media="(prefers-color-scheme: dark)" />
    <!-- IBM Plex Sans KR carries both Latin and Hangul; JetBrains Mono is the
         numeric/label voice. Both degrade to the platform faces if the fonts
         never arrive, so the app stays usable offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>KCCP PPT Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
